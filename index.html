<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>uif.eu — design mockups</title>
<style>
  :root{
    --blue:#0057b7; --blue-dark:#003d82; --yellow:#ffd700;
    --ink:#15202f; --ink2:#5a6572; --line:#dfe5ee; --card:#fff; --bg:#f2f5f9;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8edf6; --ink2:#a6b2c5; --line:#2b3648; --card:#161f2c; --bg:#0e141d; --blue:#3d84dd; }
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px;line-height:1.5}
  .box{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:30px 28px;box-shadow:0 1px 3px rgba(20,30,50,.06),0 12px 32px rgba(20,30,50,.09)}
  .flag{width:38px;height:20px;border-radius:3px;background:linear-gradient(to bottom,var(--blue) 50%,var(--yellow) 50%)}
  h1{font-size:19px;margin:16px 0 4px;letter-spacing:-.01em}
  p.sub{margin:0 0 20px;font-size:13.5px;color:var(--ink2)}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-bottom:7px}
  input{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--bg);
    border:1.5px solid var(--line);border-radius:9px;padding:11px 13px}
  input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
  button{width:100%;margin-top:12px;font-family:inherit;font-size:14.5px;font-weight:600;color:#fff;
    background:var(--blue);border:0;border-radius:9px;padding:12px;cursor:pointer}
  button:hover:not(:disabled){background:var(--blue-dark)}
  button:disabled{opacity:.6;cursor:default}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .msg{margin-top:13px;font-size:13px;min-height:19px}
  .msg.err{color:#c0311a}
  .msg.busy{color:var(--ink2)}
  @media (prefers-color-scheme: dark){ .msg.err{color:#f08370} }
  .foot{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
</style>
</head>
<body>
<main class="box">
  <div class="flag" aria-hidden="true"></div>
  <h1>uif.eu — design mockups</h1>
  <p class="sub">This preview is access-restricted. Enter the code you were given to view it.</p>
  <form id="f" autocomplete="off">
    <label for="code">Access code</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"
           aria-describedby="msg" placeholder="Enter code">
    <button id="go" type="submit">View mockups</button>
  </form>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="foot">July 2026 feedback round · Ukraine Investment Framework</div>
</main>

  var f=document.getElementById('f'),input=document.getElementById('code'),
      btn=document.getElementById('go'),msg=document.getElementById('msg');

  function bytes(b64){var s=atob(b64),a=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}

  function say(text,cls){msg.textContent=text;msg.className='msg'+(cls?' '+cls:'');}

  f.addEventListener('submit',function(e){
    e.preventDefault();
    var code=input.value.trim();
    if(!code){say('Enter the access code.','err');input.focus();return;}
    if(!(window.crypto&&window.crypto.subtle)){
      say('This browser cannot decrypt the preview. Try a current Chrome, Edge, Firefox or Safari.','err');return;
    }
    btn.disabled=true;say('Unlocking…','busy');

    setTimeout(function(){
      crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey'])
      .then(function(base){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:bytes(DATA.salt),iterations:DATA.it,hash:'SHA-256'},
          base,{name:'AES-GCM',length:256},false,['decrypt']);
      })
      .then(function(key){
        return crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(DATA.iv)},key,bytes(DATA.ct));
      })
      .then(function(buf){
        var html=new TextDecoder().decode(buf);
        document.open();document.write(html);document.close();
      })
      .catch(function(){
        btn.disabled=false;
        say('That code is not correct. Check it and try again.','err');
        input.select();
      });
    },30);
  });
  input.focus();
})();
